// PSCO Repository Binding 最小 Protocol Buffers 合同源
//
// 文档定位：本文件是 Repository Binding 当前阶段唯一合同定义入口（phase04-11 落地）。
// 上游规格：
//   - phase04-08 Product / Repository / Binding 最小 Proto 合同设计 Spec
//                §"Proto 包名、目录与版本语义必须冻结"
//                / §"Repository Binding 最小消息结构必须覆盖当前动作矩阵"
//                / §"字段语义与页面动作必须单值映射"
//                / §"字段编号方案必须在当前阶段冻结"
//                / §"服务接口必须对齐 phase04-07 已冻结的接口分组"
//                / §"详情读取与候选读取必须保持消息边界分离"
//                / §"错误语义必须在合同设计中保留显式映射前提"
//                / §"chi + JSON HTTP 必须从 Proto 单向承接"
//                / §"RPC 到 HTTP 的映射矩阵必须明确"
//                / §"合同演进与 breaking check 规则必须冻结"
//   - phase04-10 product_repository_binding_spec_v0.1.md §合同设计（Proto 主线）
//   - phase04-11 Product / Repository / Binding 最小 Protocol Buffers 合同主线 Spec
//
// 落点要求：
//   - 本文件落地到现有 proto/ 工作区，复用同一 buf workspace
//   - 不新增第二套 buf.yaml / buf.gen.yaml / Makefile 或并列 proto 根目录
//   - 与 Module Registry / Decision Center / Product Registry
//     在同一个 buf workspace 内共同通过校验
//
// 过渡传输层说明：
//   当前阶段保留 chi + JSON HTTP 作为过渡传输层（phase04-12/13 实现）。
//   JSON 请求与响应语义必须从本 .proto 派生或严格对齐，不得形成第二套合同源。
//   HTTP 路径、状态码与中间件策略不属于本合同本体，由过渡传输层独立承载。
//   URL 路径参数（如 repositoryId）由 handler 在进入业务层前组装为
//   对应 Proto request 字段，该组装行为只属于过渡传输层，不构成第二套合同定义。
//
// 字段编号规则：
//   - 每个字段拥有稳定编号，不得复用已删除字段编号或字段语义
//   - 新增字段必须使用新的递增编号，不得插入到已有编号之间
//   - reserved 关键字用于标记已删除或预留的编号区间
//   - 后续版本删除字段或废弃字段名时必须使用 reserved 保留字段号
//
// 跨包依赖策略：
//   - MappedModuleSummary.module_status / RepositoryModuleCandidate.module_status
//     通过 import 直接复用 psco.module_registry.v1.ModuleStatus
//   - Repository / BoundProductSummary / RepositoryProductCandidate 的 status
//     复用 psco.common.v1.ActiveArchivedStatus
//   - 不得在 psco.repository_binding.v1 中重定义本地等价枚举
//   - 该 import 仅限于复用枚举类型，不得因此引入对
//     Module Registry service 或其他消息结构的合同依赖
//
// 排序规则边界：
//   - 列表读取与候选读取的排序语义（phase04-04 冻结的列表读取与三条候选读取均按 created_at 降序）
//     由 service / repository 层承接，不进入 .proto 合同本体
//   - .proto 合同只定义消息结构与字段，不定义 order_by 字段或排序注解
//   - 该边界承接现有 psco.decision_center.v1.decision_center.proto 已建立模式
//
// 生成入口：
//   在 proto/ 目录执行 make gen，或直接执行 buf generate。
//   生成产物：
//     - Go:    backend/internal/gen/proto/psco/repository_binding/v1/
//     - TS:    frontend/src/gen/proto/psco/repository_binding/v1/
//
// 当前阶段边界：
//   - 只生成消息类型，不生成 gRPC 服务桩
//   - service 定义在 .proto 合同源中已冻结，后续迁移到 gRPC / Connect 时再加回 grpc/connect 插件
//   - 不要求完成完整 gRPC / Connect 传输层迁移
//   - 不要求立即用生成类型替换全部现有手写 DTO

syntax = "proto3";

package psco.repository_binding.v1;

import "google/protobuf/timestamp.proto";
// 跨包 import：复用 Module Registry 的 ModuleStatus 枚举，避免引入第二套状态语义。
// 该 import 仅限于 ModuleStatus 枚举类型，不引入 Module Registry service 依赖。
import "psco/module_registry/v1/module_registry.proto";
// 跨包 import：复用 Common 的 ActiveArchivedStatus 枚举，避免引入第二套 active/archived 语义。
// 该 import 仅限于 ActiveArchivedStatus 枚举类型，不引入其他合同依赖。
import "psco/common/v1/common.proto";

// Go 包路径（生成代码落点）
option go_package = "github.com/psco/backend/internal/gen/proto/psco/repository_binding/v1;repositorybindingv1";

// ============================================================================
// 核心对象（phase04-04 冻结的数据范围）
// ============================================================================

// Repository 核心对象 — 最小字段：id / name / url / provider / status / created_at。
message Repository {
  string id = 1;
  string name = 2;
  string url = 3;
  string provider = 4;
  psco.common.v1.ActiveArchivedStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
}

// ============================================================================
// 读组消息结构
// ============================================================================

// RepositoryListItem — 列表读取模型。
// 至少承接 id / name / url / provider / status / created_at / product_bind_count / module_bind_count。
message RepositoryListItem {
  string id = 1;
  string name = 2;
  string url = 3;
  string provider = 4;
  psco.common.v1.ActiveArchivedStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  int32 product_bind_count = 7;
  int32 module_bind_count = 8;
}

// BoundProductSummary — 详情读取中的已绑定 Product 摘要。
// product_status 复用 psco.common.v1.ActiveArchivedStatus。
message BoundProductSummary {
  string product_id = 1;
  string product_name = 2;
  psco.common.v1.ActiveArchivedStatus product_status = 3;
}

// MappedModuleSummary — 详情读取中的已映射 Module 摘要。
// module_status 通过 import 复用 psco.module_registry.v1.ModuleStatus。
message MappedModuleSummary {
  string module_id = 1;
  string module_name = 2;
  psco.module_registry.v1.ModuleStatus module_status = 3;
}

// RepositoryDetail — 详情读取模型。
// 统一承接 Repository 核心字段、已绑定 Product 列表与已映射 Module 列表。
// 候选读取结果不内嵌于此，必须通过 ListRepositoryProductCandidates /
// ListRepositoryModuleCandidates 独立承接。
message RepositoryDetail {
  Repository repository = 1;
  repeated BoundProductSummary bound_products = 2;
  repeated MappedModuleSummary mapped_modules = 3;
}

// ============================================================================
// 候选读取消息结构
// ============================================================================

// RepositoryProductCandidate — Product 候选读取返回项。
// product_status 复用 psco.common.v1.ActiveArchivedStatus。
// 候选读取排序语义（phase04-04 冻结按 created_at 降序）
// 由 service/repository 层承接，不进入 .proto 合同本体。
message RepositoryProductCandidate {
  string product_id = 1;
  string product_name = 2;
  psco.common.v1.ActiveArchivedStatus product_status = 3;
}

// RepositoryModuleCandidate — Module 候选读取返回项。
// module_status 通过 import 复用 psco.module_registry.v1.ModuleStatus。
// 候选读取排序语义（phase04-04 冻结按 created_at 降序）
// 由 service/repository 层承接，不进入 .proto 合同本体。
message RepositoryModuleCandidate {
  string module_id = 1;
  string module_name = 2;
  psco.module_registry.v1.ModuleStatus module_status = 3;
}

// ============================================================================
// 读组请求与响应消息
// ============================================================================

// ListRepositoriesRequest — 列表读取筛选参数（query_text / status_filter）。
// status_filter 为 UNSPECIFIED 时表示不过滤（对应 UI/路由层的 all）。
message ListRepositoriesRequest {
  string query_text = 1;
  psco.common.v1.ActiveArchivedStatus status_filter = 2;
}

// ListRepositoriesResponse — 列表读取响应。
message ListRepositoriesResponse {
  repeated RepositoryListItem repositories = 1;
}

// GetRepositoryDetailRequest — 详情读取请求。
message GetRepositoryDetailRequest {
  string repository_id = 1;
}

// GetRepositoryDetailResponse — 详情读取响应。
// 只承接详情本体、已绑定产品列表与已映射模块列表，不内嵌候选读取结果。
message GetRepositoryDetailResponse {
  RepositoryDetail repository_detail = 1;
}

// ListRepositoryProductCandidatesRequest — Product 候选读取请求。
// repository_id 用于排除已建立绑定的目标，避免重复绑定。
message ListRepositoryProductCandidatesRequest {
  string repository_id = 1;
}

// ListRepositoryProductCandidatesResponse — Product 候选读取响应。
// 无可关联候选时返回空列表，不返回错误。
message ListRepositoryProductCandidatesResponse {
  repeated RepositoryProductCandidate candidates = 1;
}

// ListRepositoryModuleCandidatesRequest — Module 候选读取请求。
// repository_id 用于排除已建立绑定的目标，避免重复绑定。
message ListRepositoryModuleCandidatesRequest {
  string repository_id = 1;
}

// ListRepositoryModuleCandidatesResponse — Module 候选读取响应。
// 无可关联候选时返回空列表，不返回错误。
message ListRepositoryModuleCandidatesResponse {
  repeated RepositoryModuleCandidate candidates = 1;
}

// ============================================================================
// 写组请求与响应消息
// ============================================================================

// CreateRepositoryRequest — 创建写入请求。
// phase06 draft-first 语义下：
//   - 最小人工必填：name / url
//   - provider 为空时由系统默认补为 "manual"
//   - status 为空 / UNSPECIFIED 时由系统默认补为 ACTIVE
// 若显式提供 status，则仍只允许 active / archived。
message CreateRepositoryRequest {
  string name = 1;
  string url = 2;
  string provider = 3;
  psco.common.v1.ActiveArchivedStatus status = 4;
}

// CreateRepositoryResponse — 创建响应，只返回新建 Repository 标识。
// 支撑前端成功后进入新 Repository Binding Detail / Workspace，不返回完整 Repository 对象。
message CreateRepositoryResponse {
  string repository_id = 1;
}

// BindRepositoryToProductRequest — 绑定 Repository 到 Product 写入最小字段。
// repository_id 在 RPC 请求中显式承接；在 HTTP 过渡层中由 URL 路径参数隐式承接。
message BindRepositoryToProductRequest {
  string repository_id = 1;
  string product_id = 2;
}

// BindRepositoryToProductResponse — 绑定响应（当前阶段无返回体）。
message BindRepositoryToProductResponse {}

// MapModuleToRepositoryRequest — 映射 Module 到 Repository 写入最小字段。
// repository_id 在 RPC 请求中显式承接；在 HTTP 过渡层中由 URL 路径参数隐式承接。
message MapModuleToRepositoryRequest {
  string repository_id = 1;
  string module_id = 2;
}

// MapModuleToRepositoryResponse — 映射响应（当前阶段无返回体）。
message MapModuleToRepositoryResponse {}

// ============================================================================
// 服务接口
// ============================================================================

// RepositoryBindingService — Repository Binding 当前阶段完整动作矩阵的 RPC 合同。
//
// 接口分组对齐 phase04-07：
//   - 读组：ListRepositories / GetRepositoryDetail
//   - 写组：CreateRepository / BindRepositoryToProduct / MapModuleToRepository
//   - 候选读取：ListRepositoryProductCandidates / ListRepositoryModuleCandidates
//
// 详情与候选读取边界：
//   GetRepositoryDetail 只承接详情本体、已绑定产品列表与已映射模块列表；
//   两条候选读取通过独立 request/response 承接候选读取，
//   不得把候选结果直接塞进详情响应。
//
// 关系写入后的读取语义：
//   BindRepositoryToProduct / MapModuleToRepository 提交成功后，
//   默认后端语义为"详情页重新读取当前已绑定结果"，
//   不额外设计脱离 RepositoryDetailRead 的回流读取路径。
//
// 错误语义：
//   合同设计为校验失败、资源不存在、重复冲突与空结果语义保留稳定承接空间；
//   两条候选读取的空结果都必须表现为正常空列表响应，不得设计为空错误；
//   HTTP 状态码映射继续由过渡传输层负责，不写进 .proto 合同本体。
//
// 过渡传输层映射：
//   当前阶段由 chi + JSON HTTP 承接，RPC 到 HTTP 的映射约定见 proto/README.md。
//   后续阶段可迁移到 gRPC / Connect 而不需要修改本合同源。
service RepositoryBindingService {
  // --- 读组 ---

  // RepositoryListRead — 列表读取
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);

  // RepositoryDetailRead — 详情读取（不含候选读取结果）
  rpc GetRepositoryDetail(GetRepositoryDetailRequest) returns (GetRepositoryDetailResponse);

  // --- 写组 ---

  // RepositoryCreateWrite — 创建 Repository
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);

  // RepositoryProductBindingWrite — 绑定 Repository 到 Product
  rpc BindRepositoryToProduct(BindRepositoryToProductRequest) returns (BindRepositoryToProductResponse);

  // RepositoryModuleMappingWrite — 映射 Module 到 Repository
  rpc MapModuleToRepository(MapModuleToRepositoryRequest) returns (MapModuleToRepositoryResponse);

  // --- 候选读取 ---

  // ProductBindingCandidateRead — Product 候选读取
  rpc ListRepositoryProductCandidates(ListRepositoryProductCandidatesRequest) returns (ListRepositoryProductCandidatesResponse);

  // RepositoryModuleCandidateRead — Module 候选读取
  rpc ListRepositoryModuleCandidates(ListRepositoryModuleCandidatesRequest) returns (ListRepositoryModuleCandidatesResponse);
}
