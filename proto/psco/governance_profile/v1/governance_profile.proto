// PSCO Governance Profile 最小治理画像协议合同源
//
// 文档定位：本文件是 phase13 项目级治理画像结构化写读能力的唯一合同定义入口。
// 上游规格：
//   - phase13-04 项目治理画像数据模型与字段设计 Spec（9 类核心字段与字段分类矩阵）
//   - phase13-05 后端合同、存储与读写边界设计 Spec（8 项全局规范资产承接矩阵）
//   - phase13-08 落实项目治理画像后端主线 Spec（唯一后端实现主线）
//
// 合同约束：
//   - repository_id 是唯一正式结构化输入锚点（repository-scoped governance aggregate）
//   - 治理画像写读是项目级治理层承接位，不是第五个业务主实体
//   - track_type / current_phase_name / current_phase_ref / current_phase_status 为
//     read-only 字段：只允许来自根级正式上游的冻结结果回读，不得由维护写路径改写，
//     因此 UpdateGovernanceProfileRequest 不携带这些字段
//   - markdown 正文不入库：合同只承接结构化字段、入口关系、角色与必要摘要
//   - 与 ProjectContextService 的职责分层：本服务承接治理画像结构化写读；
//     ProjectContextService 继续承接 phase12 最小只读聚合，两者不得并列为第二套事实源
//   - 本服务不是完整 agent brief 入口（phase13-10 另行承接）
//
// 生成入口：
//   在 proto/ 目录执行 make gen，或直接执行 buf generate。
//   生成产物：
//     - Go:    backend/internal/gen/proto/psco/governance_profile/v1/
//     - Go Connect: backend/internal/gen/connect/psco/governance_profile/v1/
//     - TS:    frontend/src/gen/proto/psco/governance_profile/v1/

syntax = "proto3";

package psco.governance_profile.v1;

import "google/protobuf/timestamp.proto";

// Go 包路径（生成代码落点）
option go_package = "github.com/psco/backend/internal/gen/proto/psco/governance_profile/v1;governanceprofilev1";

// ============================================================================
// 枚举
// ============================================================================

// TrackType 当前项目正式技术路线（受控枚举，read-only）。
// 对齐 TECH_STACK_BASELINE.md 的两条受控路线。
enum TrackType {
  TRACK_TYPE_UNSPECIFIED = 0;
  // Product Track：React + Hono + Drizzle 业务产品路线
  TRACK_TYPE_PRODUCT = 1;
  // Durable System Track：React + Go + PostgreSQL 长期运行系统路线（PSCO 当前冻结路线）
  TRACK_TYPE_DURABLE_SYSTEM = 2;
}

// PhaseStatus 当前阶段状态（受控枚举，read-only）。
// 第一版允许值：planned / in_progress / completed / blocked。
enum PhaseStatus {
  PHASE_STATUS_UNSPECIFIED = 0;
  PHASE_STATUS_PLANNED = 1;
  PHASE_STATUS_IN_PROGRESS = 2;
  PHASE_STATUS_COMPLETED = 3;
  PHASE_STATUS_BLOCKED = 4;
}

// ============================================================================
// 核心消息
// ============================================================================

// CanonicalRootFileBinding 根级 canonical 文件绑定。
// 对齐 phase13-04 嵌套字段矩阵：file_name / role / required。
message CanonicalRootFileBinding {
  // 根级 canonical 文件名（如 project_rules.md）
  string file_name = 1;
  // 该文件在项目治理中的正式角色（如 rules / tech_baseline）
  string role = 2;
  // 是否为当前项目范式必需文件
  bool required = 3;
}

// GlobalAssetBinding 全局规范资产绑定。
// 对齐 phase13-05 冻结的 8 项资产承接矩阵：
//   - 前 5 项（project_rules / TECH_STACK_BASELINE / AGENTS / architecture_map / plan）
//     必须携带 structured_summary
//   - 后 3 项（README / global_skills / project_skills）第一版允许 summary 为空
message GlobalAssetBinding {
  // 资产名（必须属于 8 项冻结矩阵）
  string name = 1;
  // 资产分类（如 rules / tech_baseline / agents）
  string kind = 2;
  // 资产正式入口引用（定位与回源入口，不是正文）
  string entry_ref = 3;
  // 该资产在项目治理中的正式角色
  string role = 4;
  // 结构化摘要（仅前 5 项摘要型资产必填）
  optional string structured_summary = 5;
  // 该资产正文是否允许按 entry_ref 回源（只读能力状态，不代表全文已入库）
  optional bool markdown_resolvable = 6;
}

// GovernanceProfile 项目治理画像聚合（repository-scoped）。
// 对齐 phase13-04 冻结的 9 类核心字段。
message GovernanceProfile {
  // 唯一项目锚点
  string repository_id = 1;
  // 治理画像正式版本（第一版固定为 project_governance_profile_v1）
  string project_profile_version = 2;
  // 当前项目技术路线（read-only，来自根级上游冻结结果）
  TrackType track_type = 3;
  // 模板来源（optional 手工维护字段，为空表示尚未声明）
  optional string template_source = 4;
  // docs workflow 结构布局（如 phase/fix/audit/review）
  string docs_workflow_layout = 5;
  // canonical 根级文件绑定集合
  repeated CanonicalRootFileBinding canonical_root_files = 6;
  // 全局规范资产绑定集合
  repeated GlobalAssetBinding global_asset_bindings = 7;
  // 当前阶段名称（read-only）
  string current_phase_name = 8;
  // 当前阶段正式入口引用（read-only，指向正式 phase 入口）
  string current_phase_ref = 9;
  // 当前阶段状态（read-only）
  PhaseStatus current_phase_status = 10;
  // 创建时间
  google.protobuf.Timestamp created_at = 11;
  // 最后更新时间
  google.protobuf.Timestamp updated_at = 12;
}

// ============================================================================
// 请求 / 响应
// ============================================================================

// GetGovernanceProfileRequest 结构化读取请求。
message GetGovernanceProfileRequest {
  // 唯一正式结构化输入锚点
  string repository_id = 1;
}

// GetGovernanceProfileResponse 结构化读取响应。
message GetGovernanceProfileResponse {
  GovernanceProfile profile = 1;
}

// UpdateGovernanceProfileRequest 治理画像保存请求（手工维护优先）。
//
// 可写集合冻结（phase13-09 前端写边界 + phase13-08 后端主线收口）：
//   - template_source
//   - canonical_root_files[]（file_name / role / required）
//   - global_asset_bindings[]（name / kind / entry_ref / role / structured_summary）
//
// 显式排除（read-only，不由本请求携带）：
//   - docs_workflow_layout（由服务端固定为根级正式上游冻结值；字段号保留为兼容位）
//   - track_type / current_phase_name / current_phase_ref / current_phase_status
//   - project_profile_version（由服务端固定为当前正式版本）
//   - global_asset_bindings[].markdown_resolvable（由服务端按资产矩阵计算返回）
message UpdateGovernanceProfileRequest {
  // 唯一正式结构化输入锚点
  string repository_id = 1;
  // 模板来源（optional，允许为空）
  optional string template_source = 2;
  // Deprecated compatibility field.
  // 第一版不再接受客户端写入 docs workflow 布局；服务端始终使用冻结基线值。
  optional string docs_workflow_layout = 3 [deprecated = true];
  // canonical 根级文件绑定集合（至少 1 项）
  repeated CanonicalRootFileBinding canonical_root_files = 4;
  // 全局规范资产绑定集合（至少 1 项，name 必须属于 8 项冻结矩阵）
  repeated GlobalAssetBinding global_asset_bindings = 5;
}

// UpdateGovernanceProfileResponse 保存响应，返回保存后的完整治理画像。
message UpdateGovernanceProfileResponse {
  GovernanceProfile profile = 1;
}

// ============================================================================
// 服务
// ============================================================================

// GovernanceProfileService 项目治理画像结构化写读服务。
//
// 职责边界（phase13-08 冻结）：
//   - 本服务是治理画像结构化写读的唯一正式承接位
//   - 保存入口在单一事务边界内处理主记录与两组 bindings
//   - 不触发目录扫描、模板自动同步、正文拉取入库或自动状态建议
service GovernanceProfileService {
  // 读取治理画像结构化字段与两组 bindings。
  // 失败语义：repository 不存在或画像未创建 → NotFound；
  //           结构化读取失败 → Internal。
  rpc GetGovernanceProfile(GetGovernanceProfileRequest) returns (GetGovernanceProfileResponse);

  // 保存治理画像（手工维护优先，单一事务边界）。
  // 失败语义：repository 不存在 → NotFound；输入违反字段矩阵 → InvalidArgument；
  //           保存失败 → Internal（整体失败，不写入半套状态）。
  rpc UpdateGovernanceProfile(UpdateGovernanceProfileRequest) returns (UpdateGovernanceProfileResponse);
}
