// PSCO Project Context 最小只读协议合同源
//
// 文档定位：本文件是 phase11-07 最小只读项目上下文聚合读取能力与
// phase13-10 agent 项目简报读取主线的唯一合同定义入口。
// 上游规格：
//   - phase11-05 最小只读项目上下文聚合导出设计 Spec
//   - phase11-07 落实最小只读项目上下文聚合读取能力 Spec
//   - phase13-07 agent 项目简报输入与读取设计 Spec（brief schema 与本服务受控演进关系）
//   - phase13-10 落实 agent 项目简报读取主线 Spec（GetProjectBrief 后端实现主线）
//
// 落点要求：
//   - 本文件落地到现有 proto/ 工作区，复用同一 buf workspace
//   - 不新增第二套 buf.yaml / buf.gen.yaml / Makefile 或并列 proto 根目录
//
// 合同约束：
//   - 该能力是聚合只读读取，不是新实体主线
//   - 该能力复用既有 .proto + ConnectRPC 正式主线
//   - 该能力不得偷渡 MCP、CLI、前端对话式入口或任何第二协议层
//   - repository_id 是唯一正式结构化输入锚点
//   - GetProjectContext 只承接"已完成 Repository Binding"的仓库上下文读取；
//     "已完成 Repository Binding" 当前阶段明确解释为：
//       至少已有一条 product_repositories 绑定，且至少已有一条 module_repositories 映射
//   - GetProjectBrief 不做绑定完整性强制校验：数组为空是合法状态
//   - Decision 聚合口径遵守 phase11-05 已冻结的两类 module-link 派生命中范围
//   - 不依赖消费侧项目目录结构或固定文件名
//   - 2026-08-18 phase14-10 T7 用户裁决：画像残余彻底退役，governance_profile/
//     current_phase 移除并 reserved；template_source 语义由 standard_bindings
//     (role=template_source) 承接；track_type/时间轴不保留，phase15 如进入另行新建
//
// 生成入口：
//   在 proto/ 目录执行 make gen，或直接执行 buf generate。
//   生成产物：
//     - Go:    backend/internal/gen/proto/psco/project_context/v1/
//     - Go Connect: backend/internal/gen/connect/psco/project_context/v1/
//     - TS:    frontend/src/gen/proto/psco/project_context/v1/

syntax = "proto3";

package psco.project_context.v1;

import "google/protobuf/timestamp.proto";
import "psco/standard/v1/standard.proto";
import "psco/progress/v1/progress.proto";

// Go 包路径（生成代码落点）
option go_package = "github.com/psco/backend/internal/gen/proto/psco/project_context/v1;projectcontextv1";

// ============================================================================
// 核心消息
// ============================================================================

// RepositorySummary — 当前仓库身份摘要。
message RepositorySummary {
  string id = 1;
  string name = 2;
  string provider = 3;
  string url = 4;
  string description = 5;
}

// ProductSummary — 关联产品摘要。
message ProductSummary {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
}

// ModuleSummary — 关联模块摘要。
message ModuleSummary {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
}

// DecisionSummary — 关联决策摘要。
// 命中来源字段标识该 Decision 通过哪类 module-link 派生上下文关系被命中。
// 当前阶段只允许：
//   - repository_module_mapping
//   - bound_product_module
message DecisionSummary {
  string id = 1;
  string title = 2;
  string status = 3;
  string context = 4;
  repeated string hit_sources = 5;
  google.protobuf.Timestamp created_at = 6;
}

// RuleEntry — 规则与约束入口。
// 当前阶段从 project_rules.md 与 TECH_STACK_BASELINE.md 的摘要投影。
message RuleEntry {
  string key = 1;
  string label = 2;
  string summary = 3;
  string entry_ref = 4;
  string entry_kind = 5;
}

// PhaseEntry — 当前 phase 相关的文档入口。
message PhaseEntry {
  string phase = 1;
  string label = 2;
  string status_summary = 3;
  string entry_ref = 4;
  string entry_kind = 5;
}

// BoundaryEntry — 当前阶段明确不做或不承接的边界摘要。
// 当前阶段只承接最小可读摘要，不扩写为第二套规则系统。
message BoundaryEntry {
  string key = 1;
  string label = 2;
  string summary = 3;
}

// ============================================================================
// 读组请求与响应消息
// ============================================================================

// GetProjectContextRequest — 项目上下文读取请求。
// repository_id 是唯一正式结构化输入锚点。
message GetProjectContextRequest {
  string repository_id = 1;
}

// GetProjectContextResponse — 项目上下文读取响应。
// 以当前 Repository 为根，聚合关联 Product / Module / Decision 摘要及规则/文档入口。
message GetProjectContextResponse {
  RepositorySummary repository = 1;
  ProductSummary product = 2;
  repeated ModuleSummary modules = 3;
  repeated DecisionSummary decisions = 4;
  repeated RuleEntry rules = 5;
  repeated PhaseEntry phases = 6;
  repeated BoundaryEntry boundaries = 7;
}

// ============================================================================
// 导出请求与响应消息
// ============================================================================

// ExportProjectContextRequest — 项目上下文 Markdown 导出请求。
// 与 GetProjectContext 共享同一 repository_id 输入锚点。
message ExportProjectContextRequest {
  string repository_id = 1;
}

// ExportProjectContextResponse — 项目上下文 Markdown 导出响应。
// markdown 字段承载 AGENTS 风格或等价 Markdown 格式的完整导出结果。
message ExportProjectContextResponse {
  string markdown = 1;
}

// ============================================================================
// agent 项目简报（project brief for agent）
// ============================================================================

// 2026-08-18 phase14-10 T7 用户裁决留痕：本节原有画像派生消息与枚举
// （BriefGovernanceProfile / BriefCurrentPhase / BriefTrackType / BriefPhaseStatus）
// 已随画像残余彻底退役删除；template_source 语义由 standard_bindings
// (role=template_source) 承接；track_type/时间轴不保留，phase15 如进入
// 时间轴另行新建正规字段，不复活画像派生形态。

// BriefProgress — agent 项目简报进度摘要块（phase15 裁决⑩）。
// 定义于 project_context.proto（内联轻量消息）；latest_task_completed 与
// recent_events 元素同型复用 psco.progress.v1.ProgressEvent（不建第二套摘要消息）。
// 空态语义：Go 装配侧恒构造本块（非 nil）——0 事件时字段为零值、
// recent_events 为空数组，前端进度区与 agent 单值消费，无双套判空逻辑。
message BriefProgress {
  // 当前 phase 的 task_key（phaseNN）；空值含从未开始 / 全部完结两种情形（同型零值）
  string current_phase_key = 1;
  // 当前 phase 标题（该最新 phase_started 的 title）
  string current_phase_label = 2;
  // 最新完成任务项事件（三轨同序取最新；无任务完成时不设置）
  psco.progress.v1.ProgressEvent latest_task_completed = 3;
  // 最近 N=10 条三轨混合事件（三键链倒序）
  repeated psco.progress.v1.ProgressEvent recent_events = 4;
}

// GetProjectBriefRequest — agent 项目简报读取请求。
// repository_id 是唯一正式结构化输入锚点。
message GetProjectBriefRequest {
  string repository_id = 1;
}

// GetProjectBriefResponse — agent 项目简报读取响应。
// 2026-08-18 phase14-10 T7 用户裁决：画像残余彻底退役，governance_profile/
// current_phase 移除并 reserved；template_source 语义由 standard_bindings
// (role=template_source) 承接；track_type/时间轴不保留，phase15 如进入另行新建。
// 当前字段面收敛为 5 顶层块 + progress 摘要块（编号槽位 2/3/4 已 reserved；
// 时间戳随各实体摘要承载）：
//   1. repository          — 仓库身份摘要（复用既有 RepositorySummary）
//   2. governance_profile  — 已移除（reserved 2；画像残余退役，见上裁决留痕）
//   3. global_assets       — 已移除（reserved 3；phase14-09，信息经 standards[].directory_tree 承接）
//   4. current_phase       — 已移除（reserved 4；时间轴不保留，见上裁决留痕）
//   5. products            — 关联产品摘要数组（即使长度 1 也保持数组形式）
//   6. modules             — 关联模块摘要数组
//   7. decisions           — 关联决策摘要数组
//   8. standards           — 该仓库关联的全局规范数组（含 directory_tree 全树；
//                            template_source 语义经 role=template_source 绑定随本块消费）
//   9. progress            — 项目进度派生摘要块（phase15 冻结演进；另行新建正规
//                            承接，不复活画像派生形态）
//
// 约束：
//   - 5 顶层块 + progress 摘要块口径：repository / products / modules / decisions /
//     standards[] + progress（+ 时间戳类随各实体摘要承载）；standards = 8 为
//     phase14-02 冻结的正式演进；progress = 9 为 phase15 冻结的正式演进
//   - 不混入任何"给 agent 的自然语言指导词"字段
//   - 数组为空是合法状态（不做绑定完整性强制校验）
message GetProjectBriefResponse {
  RepositorySummary repository = 1;
  // phase14-09 移除 global_assets（信息经 standards[].directory_tree 承接）；
  // 2026-08-18 phase14-10 T7 裁决移除 governance_profile 与 current_phase
  // （画像残余彻底退役：template_source 语义由 standard_bindings(role=template_source)
  // 承接，track_type/时间轴不保留）。字段号与字段名同时 reserved 防复用
  // （buf FIELD_NO_DELETE_UNLESS_NAME_RESERVED 要求）。
  reserved 2, 3, 4;
  reserved "governance_profile", "global_assets", "current_phase";
  repeated ProductSummary products = 5;
  repeated ModuleSummary modules = 6;
  repeated DecisionSummary decisions = 7;
  repeated psco.standard.v1.Standard standards = 8;
  // 项目进度派生摘要块（phase15；空态恒构造，见 BriefProgress 注释）
  BriefProgress progress = 9;
}

// ============================================================================
// 服务接口
// ============================================================================

// ProjectContextService — 最小只读项目上下文聚合读取、导出与 agent 项目简报。
//
// 当前阶段承接三个只读 RPC：
//   - GetProjectBrief：agent 项目简报结构化读取（phase13-10 正式主线，
//     5 顶层块口径；2026-08-18 phase14-10 T7 裁决后不再依赖画像，不混入硬编码投影）
//   - GetProjectContext：结构化项目上下文聚合读取（deprecated 兼容层）
//   - ExportProjectContext：AGENTS 风格 Markdown 导出（deprecated 兼容层）
//
// 不承接任何业务写入、agent 写回或第二套 canonical API。
//
// 错误语义（GetProjectBrief）：
//   - 仓库不存在：返回 CodeNotFound
//   - 数组为空是合法状态，不返回 FailedPrecondition
//   - 内部读取失败：返回 CodeInternal
//
// 兼容窗口（phase13-10 冻结）：
//   - GetProjectContext / ExportProjectContext 在 phase13 内继续保留，
//     作为兼容读取层与兼容导出层；行为与响应结构保持不变（含硬编码投影）
//   - 两个旧 RPC 不再承接新的演进需求，不得与 brief 并列演化为
//     两套 canonical agent 输入协议
//   - 退役讨论进入条件：phase13-11 验收确认 brief 读取主线稳定后，
//     退役窗口作为下一阶段进入条件讨论
service ProjectContextService {
  // agent 项目简报结构化读取（正式主线）。
  rpc GetProjectBrief(GetProjectBriefRequest) returns (GetProjectBriefResponse);

  // Deprecated: 兼容读取层。agent 消费侧应迁移到 GetProjectBrief。
  rpc GetProjectContext(GetProjectContextRequest) returns (GetProjectContextResponse) {
    option deprecated = true;
  }

  // Deprecated: 兼容导出层。单向派生自 GetProjectContext 结构化结果。
  rpc ExportProjectContext(ExportProjectContextRequest) returns (ExportProjectContextResponse) {
    option deprecated = true;
  }
}
